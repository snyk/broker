version: 2.1

orbs:
  prodsec: snyk/prodsec-orb@1
  slack: circleci/slack@4.12.5

defaults: &defaults
  docker:
    - image: cimg/node:24.15
  working_directory: ~/broker
filter-tags-only: &filter-tags-only
  filters:
    tags:
      only: /^v.*/
    branches:
      ignore: /.*/
filter-dev-branch-only: &filter-dev-branch-only
  filters:
    branches:
      only: /dev\/.*/

parameters:
  fail_on_issues:
    type: boolean
    default: true

commands:
  dockerhub-login:
    steps:
      - run:
          name: Log in to a Docker registry
          command: echo $DOCKERHUB_PASSWORD | docker login -u $DOCKERHUB_USERNAME --password-stdin
  dockerhub-logout:
    steps:
      - run:
          name: Logout from a Docker registry
          command: docker logout
  get-and-set-tagged-broker-version:
    description: "Get and set version of Broker NPM package"
    steps:
      - run:
          name: Get tagged version of Broker NPM package
          command: |
            echo "Getting tagged version of Broker NPM package..."
            BROKER_VERSION=${CIRCLE_TAG/v/''}
            echo $BROKER_VERSION
            echo "export BROKER_VERSION=$BROKER_VERSION" >> "$BASH_ENV"
      - run:
          name: Set Broker version in package.json
          command: |
            npm version --commit-hooks false --git-tag-version false ${BROKER_VERSION}
  get-latest-nodejs-version:
    description: "Get latest version of specific Node.js cycle"
    parameters:
      cycle:
        type: string
        default: "20"
    steps:
      - run:
          name: Get latest Node.js <<parameters.cycle>> version
          command: |
            echo "Getting latest Node.js <<parameters.cycle>> version..."
            NODE_LATEST_VERSION=$(curl --silent https://endoflife.date/api/nodejs.json | jq -r '.[] | select (.cycle == "<<parameters.cycle>>")' | jq -r .latest)
            echo $NODE_LATEST_VERSION
            echo "export NODE_LATEST_VERSION=$NODE_LATEST_VERSION" >> "$BASH_ENV"
  install-cosign:
    parameters:
      version:
        type: string
        default: "v2.2.0"
      sha256:
        type: string
        default: "5e4791fb7a5efaaa98da651534789ec985ce8ac9c31910a810fc249f86ba2ef9"
    steps:
      - run:
          name: Install cosign
          command: |
            curl -L https://github.com/sigstore/cosign/releases/download/<<parameters.version>>/cosign-linux-amd64 -o cosign
            chmod +x cosign && sudo mv cosign /usr/local/bin/cosign
      - run:
          name: Verify cosign
          command: |
            printf '%s  /usr/local/bin/cosign\n' '<<parameters.sha256>>' | sha256sum --check
            cosign version
  configure-base-edge-candidate-identity:
    description: "Construct and validate workflow-unique base-edge candidate references"
    steps:
      - run:
          name: Configure base-edge candidate identity
          command: |
            set -euo pipefail
            if [[ ! "$CIRCLE_WORKFLOW_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
              echo "Unexpected CircleCI workflow ID: $CIRCLE_WORKFLOW_ID" >&2
              exit 1
            fi

            CANDIDATE_REPOSITORY="snyk/broker"
            CANDIDATE_TAG="base-edge-candidate-$CIRCLE_WORKFLOW_ID"
            CANDIDATE_AMD64_TAG="$CANDIDATE_TAG-amd64"
            CANDIDATE_ARM64_TAG="$CANDIDATE_TAG-arm64"

            for tag in "$CANDIDATE_TAG" "$CANDIDATE_AMD64_TAG" "$CANDIDATE_ARM64_TAG"; do
              if [[ ! "$tag" =~ ^base-edge-candidate-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(-(amd64|arm64))?$ ]]; then
                echo "Refusing non-candidate tag: $tag" >&2
                exit 1
              fi
            done

            {
              printf 'export CANDIDATE_REPOSITORY=%q\n' "$CANDIDATE_REPOSITORY"
              printf 'export CANDIDATE_TAG=%q\n' "$CANDIDATE_TAG"
              printf 'export CANDIDATE_AMD64_TAG=%q\n' "$CANDIDATE_AMD64_TAG"
              printf 'export CANDIDATE_ARM64_TAG=%q\n' "$CANDIDATE_ARM64_TAG"
            } >> "$BASH_ENV"
  build-and-save-docker-image:
    description: "Build Docker image and save it to workspace"
    parameters:
      additional_arguments:
        type: string
        default: ""
      dockerfile:
        type: string
        default: ""
      project_name:
        type: string
        default: "broker"
    steps:
      - run:
          name: Build Docker image (<<parameters.project_name>> - <<parameters.dockerfile>>)
          command: |
            echo "Building Broker image $CIRCLE_PROJECT_REPONAME:$CIRCLE_WORKFLOW_ID..."
            docker build \
              <<#parameters.additional_arguments>><<parameters.additional_arguments>><</parameters.additional_arguments>> \
              --no-cache \
              --tag <<parameters.project_name>>:$CIRCLE_WORKFLOW_ID \
              --file <<parameters.dockerfile>> .
      - run:
          name: Archive Docker image
          command: |
            mkdir -p /tmp/workspace/images
            docker save <<parameters.project_name>>:$CIRCLE_WORKFLOW_ID \
              | gzip > "/tmp/workspace/images/<<parameters.project_name>>:$CIRCLE_WORKFLOW_ID.tar.gz"
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - images
  load-docker-image:
    description: "Load a saved Docker image"
    parameters:
      project_name:
        type: string
        default: "broker"
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Load archived Docker image
          command: |
            docker load < "/tmp/workspace/images/<<parameters.project_name>>:$CIRCLE_WORKFLOW_ID.tar.gz"
  load-slack-templates:
    steps:
      - run:
          name: Load Slack message templates
          command: |
            echo 'export SLACK_FAIL_MESSAGE_TEMPLATE=$(cat .circleci/templates/slack_fail_message.json)' >> $BASH_ENV
  notify-slack-on-failure:
    parameters:
      channel:
        type: string
        default: hybrid-cicd-alerts
    steps:
      - slack/notify:
          channel: <<parameters.channel>>
          event: fail
          template: SLACK_FAIL_MESSAGE_TEMPLATE
  tag-and-push-docker-image:
    description: "Tag and push Docker image to registry"
    parameters:
      image_name:
        type: string
      image_tag:
        type: string
      project_name:
        type: string
        default: "broker"
    steps:
      - run:
          name: Tag Docker image
          command: |
            export IMAGE_NAME=<<parameters.image_name>>
            export IMAGE_TAG=${CIRCLE_TAG/v/''}-<<parameters.image_tag>>
            export IMAGE_TAG_LATEST=<<parameters.image_tag>>
            [[ "$IMAGE_TAG" =~ .*dev$ ]] && export IMAGE_TAG=<<parameters.image_tag>>
            [[ "$IMAGE_TAG" =~ .*dev$ ]] && export IMAGE_TAG_LATEST=<<parameters.image_tag>>

            echo "Configured Broker image tags:"
            echo "  - IMAGE_TAG:        $IMAGE_TAG"
            echo "  - IMAGE_TAG_LATEST: $IMAGE_TAG_LATEST"

            echo "Tagging Broker image $IMAGE_NAME:$IMAGE_TAG..."
            docker tag <<parameters.project_name>>:$CIRCLE_WORKFLOW_ID $IMAGE_NAME:$IMAGE_TAG
            echo "Tagging Broker image $IMAGE_NAME:$IMAGE_TAG_LATEST..."
            docker tag <<parameters.project_name>>:$CIRCLE_WORKFLOW_ID $IMAGE_NAME:$IMAGE_TAG_LATEST

            echo "export IMAGE_NAME=$IMAGE_NAME" >> "$BASH_ENV"
            echo "export IMAGE_TAG=$IMAGE_TAG" >> "$BASH_ENV"
            echo "export IMAGE_TAG_LATEST=$IMAGE_TAG_LATEST" >> "$BASH_ENV"
      - run:
          name: Push Docker image
          command: |
            echo "Pushing Broker image $IMAGE_NAME:$IMAGE_TAG..."
            docker push $IMAGE_NAME:$IMAGE_TAG
            echo "Pushing Broker image $IMAGE_NAME:$IMAGE_TAG_LATEST..."
            docker push $IMAGE_NAME:$IMAGE_TAG_LATEST
      - run:
          name: Sign Docker image with Cosign
          command: |
            export IMAGE_WITH_DIGEST=$(docker image inspect --format='{{index .RepoDigests 0}}' $IMAGE_NAME:$IMAGE_TAG)
            echo "Using digest $IMAGE_WITH_DIGEST to sign the image..."
            export COSIGN_KEY=$(echo $COSIGN_ENCODED_KEY | base64 -d)
            cosign sign --yes --key env://COSIGN_KEY --annotations tag=$IMAGE_TAG $IMAGE_WITH_DIGEST
            unset COSIGN_KEY
  prepare:
    description: "Checkout repository source code and load all Slack templates"
    steps:
      - checkout
      - load-slack-templates
  prepare-dev-package-metadata:
    steps:
      - run:
          name: Prepare package.json and metadata.json for dev images
          command: |
            cd dockerfiles/.scripts && source prepare.sh

jobs:
  install-npm-packages:
    <<: *defaults
    environment:
      NODE_ENV: development
    steps:
      - prepare
      - run:
          name: Install NPM packages
          command: npm clean-install
      - persist_to_workspace:
          root: .
          paths:
            - node_modules/
  lint:
    <<: *defaults
    steps:
      - prepare
      - attach_workspace:
          at: ~/broker
      - run:
          name: Lint
          command: npm run lint
  lint-json-samples:
    <<: *defaults
    steps:
      - prepare
      - run:
          name: Lint JSON templates
          command: ./lintVerifier.sh
  test:
    <<: *defaults
    steps:
      - prepare
      - attach_workspace:
          at: ~/broker
      - run:
          name: Run tests
          command: npm test && npm run test:bin
      - store_test_results:
          path: reports
  security-scans:
    <<: *defaults
    steps:
      - prepare
      - attach_workspace:
          at: ~/broker
      - prodsec/security_scans:
          mode: auto
          open-source-additional-arguments: --exclude=test
          release-branch: main
  resolve-base-edge-validation-inputs:
    <<: *defaults
    steps:
      - prepare
      - get-latest-nodejs-version:
          cycle: "26"
      - run:
          name: Persist base-edge validation inputs
          command: |
            set -euo pipefail
            if [[ ! "$NODE_LATEST_VERSION" =~ ^26\.[0-9]+\.[0-9]+$ ]]; then
              echo "Unexpected Node.js 26 version: $NODE_LATEST_VERSION" >&2
              exit 1
            fi
            mkdir -p /tmp/workspace/base-edge-validation
            printf '%s\n' "$NODE_LATEST_VERSION" > /tmp/workspace/base-edge-validation/node-version
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - base-edge-validation/node-version
  build-base-edge-validation-image:
    <<: *defaults
    environment:
      BUILDKIT_PROGRESS: plain
      DOCKER_BUILDKIT: 1
    parameters:
      architecture:
        type: enum
        enum: ["amd64", "arm64"]
      resource_class:
        type: string
    resource_class: << parameters.resource_class >>
    steps:
      - prepare
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: false
      - run:
          name: Verify native << parameters.architecture >> execution
          command: |
            set -euo pipefail
            TARGET_ARCH="<< parameters.architecture >>"
            case "$TARGET_ARCH" in
              amd64) EXPECTED_UNAME="x86_64" ;;
              arm64) EXPECTED_UNAME="aarch64" ;;
              *) echo "Unsupported architecture: $TARGET_ARCH" >&2; exit 1 ;;
            esac

            PRIMARY_ARCH=$(uname -m)
            DOCKER_SERVER_ARCH=$(docker version --format '{{.Server.Arch}}')
            echo "Primary executor architecture: $PRIMARY_ARCH"
            echo "Remote Docker server architecture: $DOCKER_SERVER_ARCH"

            test "$PRIMARY_ARCH" = "$EXPECTED_UNAME"
            test "$DOCKER_SERVER_ARCH" = "$TARGET_ARCH"
      - run:
          name: Build base-edge validation image (<< parameters.architecture >>)
          command: |
            set -euo pipefail
            TARGET_ARCH="<< parameters.architecture >>"
            case "$TARGET_ARCH" in
              amd64)
                EXPECTED_UNAME="x86_64"
                EXPECTED_NODE_ARCH="x64"
                ;;
              arm64)
                EXPECTED_UNAME="aarch64"
                EXPECTED_NODE_ARCH="arm64"
                ;;
              *) echo "Unsupported architecture: $TARGET_ARCH" >&2; exit 1 ;;
            esac
            IMAGE_NAME="broker-edge-validation-$TARGET_ARCH:$CIRCLE_WORKFLOW_ID"
            NODE_BASE_IMAGE_NAME="broker-edge-validation-node-base-$TARGET_ARCH:$CIRCLE_WORKFLOW_ID"
            NODE_VERSION=$(< /tmp/workspace/base-edge-validation/node-version)
            EVIDENCE_DIR="/tmp/workspace/base-edge-validation/$TARGET_ARCH/evidence"
            mkdir -p "$EVIDENCE_DIR"

            docker build \
              --build-arg BASE_IMAGE=ubuntu:26.04 \
              --build-arg BROKER_VERSION="$CIRCLE_SHA1" \
              --build-arg NODE_VERSION="$NODE_VERSION" \
              --no-cache \
              --platform="linux/$TARGET_ARCH" \
              --tag "$IMAGE_NAME" \
              --file dockerfiles/base/Dockerfile . \
              2>&1 | tee "$EVIDENCE_DIR/docker-build.log"

            IMAGE_PLATFORM=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE_NAME")
            test "$IMAGE_PLATFORM" = "linux/$TARGET_ARCH"

            docker build \
              --build-arg BASE_IMAGE=ubuntu:26.04 \
              --build-arg NODE_VERSION="$NODE_VERSION" \
              --platform="linux/$TARGET_ARCH" \
              --target node-base \
              --tag "$NODE_BASE_IMAGE_NAME" \
              --file dockerfiles/base/Dockerfile . \
              2>&1 | tee "$EVIDENCE_DIR/node-base-build.log"

            NODE_BASE_NODE_VERSION=$(docker run --rm "$NODE_BASE_IMAGE_NAME" node --version)
            NODE_BASE_NPM_VERSION=$(docker run --rm "$NODE_BASE_IMAGE_NAME" npm --version)
            test "$NODE_BASE_NODE_VERSION" = "v$NODE_VERSION"

            RUNTIME_UNAME=$(docker run --rm "$IMAGE_NAME" uname -m)
            RUNTIME_NODE_VERSION=$(docker run --rm "$IMAGE_NAME" node --version)
            RUNTIME_NODE_ARCH=$(docker run --rm "$IMAGE_NAME" node -p process.arch)
            test "$RUNTIME_UNAME" = "$EXPECTED_UNAME"
            test "$RUNTIME_NODE_VERSION" = "v$NODE_VERSION"
            test "$RUNTIME_NODE_ARCH" = "$EXPECTED_NODE_ARCH"
            {
              echo "requested_platform=linux/$TARGET_ARCH"
              echo "image_platform=$IMAGE_PLATFORM"
              echo "resolved_node_version=$NODE_VERSION"
              echo "node_base_node_version=$NODE_BASE_NODE_VERSION"
              echo "node_base_npm_version=$NODE_BASE_NPM_VERSION"
              echo "runtime_uname=$RUNTIME_UNAME"
              echo "runtime_node_version=$RUNTIME_NODE_VERSION"
              echo "runtime_node_arch=$RUNTIME_NODE_ARCH"
              echo "image_id=$(docker image inspect --format '{{.Id}}' "$IMAGE_NAME")"
            } | tee "$EVIDENCE_DIR/build-evidence.txt"
      - run:
          name: Smoke test base-edge validation image (<< parameters.architecture >>)
          command: |
            set -euo pipefail
            TARGET_ARCH="<< parameters.architecture >>"
            IMAGE_NAME="broker-edge-validation-$TARGET_ARCH:$CIRCLE_WORKFLOW_ID"
            CONTAINER_NAME="broker-edge-smoke-$TARGET_ARCH-$CIRCLE_WORKFLOW_ID"
            EVIDENCE_DIR="/tmp/workspace/base-edge-validation/$TARGET_ARCH/evidence"

            cleanup() {
              status=$?
              trap - EXIT
              if [ "$status" -ne 0 ]; then
                docker logs "$CONTAINER_NAME" 2>&1 | tee "$EVIDENCE_DIR/smoke-container.log" || true
              fi
              docker rm --force "$CONTAINER_NAME" >/dev/null 2>&1 || true
              exit "$status"
            }
            trap cleanup EXIT
            trap 'exit 130' INT
            trap 'exit 143' TERM

            docker run \
              --detach \
              --name "$CONTAINER_NAME" \
              --env ACCEPT=/home/node/defaultFilters/github.json \
              "$IMAGE_NAME" \
              broker server --port 7341
            docker exec "$CONTAINER_NAME" broker --help > "$EVIDENCE_DIR/broker-help.txt"

            healthy=false
            for attempt in $(seq 1 30); do
              if [ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")" != "true" ]; then
                echo "Broker container exited before becoming healthy" >&2
                exit 1
              fi
              if docker exec "$CONTAINER_NAME" node -e \
                "fetch('http://127.0.0.1:7341/healthcheck').then(async response => { const body = await response.json(); if (!response.ok || body.ok !== true) throw new Error(JSON.stringify(body)); console.log(JSON.stringify(body)); }).catch(error => { console.error(error); process.exit(1); })" \
                | tee "$EVIDENCE_DIR/healthcheck.json"; then
                healthy=true
                break
              fi
              echo "Healthcheck attempt $attempt failed"
              sleep 1
            done
            test "$healthy" = true
      - run:
          name: Archive base-edge validation image (<< parameters.architecture >>)
          command: |
            set -euo pipefail
            TARGET_ARCH="<< parameters.architecture >>"
            IMAGE_NAME="broker-edge-validation-$TARGET_ARCH:$CIRCLE_WORKFLOW_ID"
            ARCHIVE_DIR="/tmp/workspace/base-edge-validation/$TARGET_ARCH/image"
            mkdir -p "$ARCHIVE_DIR"
            docker save "$IMAGE_NAME" | gzip > "$ARCHIVE_DIR/image.tar.gz"
            IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$IMAGE_NAME")
            IMAGE_PLATFORM=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE_NAME")
            ARCHIVE_SHA256=$(sha256sum "$ARCHIVE_DIR/image.tar.gz" | awk '{print $1}')
            test "$IMAGE_PLATFORM" = "linux/$TARGET_ARCH"
            [[ "$IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            {
              printf 'archive_sha256=%s\n' "$ARCHIVE_SHA256"
              printf 'image_id=%s\n' "$IMAGE_ID"
              printf 'image_platform=%s\n' "$IMAGE_PLATFORM"
            } > "$ARCHIVE_DIR/metadata.txt"
      - store_artifacts:
          path: /tmp/workspace/base-edge-validation/<< parameters.architecture >>/evidence
          destination: base-edge-validation/<< parameters.architecture >>/build
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - base-edge-validation/<< parameters.architecture >>
  scan-base-edge-validation-image:
    <<: *defaults
    resource_class: medium
    parameters:
      architecture:
        type: enum
        enum: ["amd64", "arm64"]
    steps:
      - prepare
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: false
      - run:
          name: Load base-edge validation image (<< parameters.architecture >>)
          command: |
            set -euo pipefail
            TARGET_ARCH="<< parameters.architecture >>"
            IMAGE_NAME="broker-edge-validation-$TARGET_ARCH:$CIRCLE_WORKFLOW_ID"
            ARCHIVE_DIR="/tmp/workspace/base-edge-validation/$TARGET_ARCH/image"
            METADATA_FILE="$ARCHIVE_DIR/metadata.txt"
            EXPECTED_ARCHIVE_SHA256=$(awk -F= '$1 == "archive_sha256" { print $2 }' "$METADATA_FILE")
            EXPECTED_IMAGE_ID=$(awk -F= '$1 == "image_id" { print $2 }' "$METADATA_FILE")
            EXPECTED_IMAGE_PLATFORM=$(awk -F= '$1 == "image_platform" { print $2 }' "$METADATA_FILE")
            [[ "$EXPECTED_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$EXPECTED_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
            test "$EXPECTED_IMAGE_PLATFORM" = "linux/$TARGET_ARCH"
            test "$(sha256sum "$ARCHIVE_DIR/image.tar.gz" | awk '{print $1}')" = "$EXPECTED_ARCHIVE_SHA256"

            docker load < "$ARCHIVE_DIR/image.tar.gz"
            IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$IMAGE_NAME")
            IMAGE_PLATFORM=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE_NAME")
            echo "Scanning image platform: $IMAGE_PLATFORM"
            test "$IMAGE_ID" = "$EXPECTED_IMAGE_ID"
            test "$IMAGE_PLATFORM" = "$EXPECTED_IMAGE_PLATFORM"
      - prodsec/container_scan:
          mode: gate
          docker-image-name: broker-edge-validation-<< parameters.architecture >>:${CIRCLE_WORKFLOW_ID}
          docker-file: dockerfiles/base/Dockerfile
          platform: linux/<< parameters.architecture >>
          log-file: /tmp/base-edge-validation-snyk-<< parameters.architecture >>.log
      - run:
          name: Collect Snyk evidence (<< parameters.architecture >>)
          when: always
          command: |
            TARGET_ARCH="<< parameters.architecture >>"
            EVIDENCE_DIR="/tmp/snyk-evidence/$TARGET_ARCH"
            mkdir -p "$EVIDENCE_DIR"
            if [ -f /tmp/container-scan.json ]; then
              cp /tmp/container-scan.json "$EVIDENCE_DIR/container-scan.json"
            fi
            if [ -f "/tmp/base-edge-validation-snyk-$TARGET_ARCH.log" ]; then
              cp "/tmp/base-edge-validation-snyk-$TARGET_ARCH.log" "$EVIDENCE_DIR/command.log"
            fi
      - store_artifacts:
          path: /tmp/snyk-evidence/<< parameters.architecture >>
          destination: base-edge-validation/<< parameters.architecture >>/snyk
  publish-base-edge-candidate-children:
    <<: *defaults
    steps:
      - prepare
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: false
      - configure-base-edge-candidate-identity
      - dockerhub-login
      - run:
          name: Publish base-edge candidate children
          command: |
            set -euo pipefail
            EVIDENCE_DIR="/tmp/base-edge-candidate-evidence/children"
            OUTPUT_DIR="/tmp/workspace/base-edge-validation/candidate"
            mkdir -p "$EVIDENCE_DIR" "$OUTPUT_DIR"

            docker buildx version | tee "$EVIDENCE_DIR/docker-buildx-version.txt"
            IMAGETOOLS_INSPECT_HELP=$(docker buildx imagetools inspect --help)
            [[ "$IMAGETOOLS_INSPECT_HELP" == *--format* ]]
            [[ "$IMAGETOOLS_INSPECT_HELP" == *--raw* ]]

            inspect_reference() {
              local reference="$1"
              local descriptor_file="$2"
              local error_file="$3"
              if docker buildx imagetools inspect \
                --format '{{json .Manifest}}' "$reference" > "$descriptor_file" 2> "$error_file"; then
                rm -f "$error_file"
                return 0
              fi
              if grep -Eqi 'manifest unknown|not found|no such manifest' "$error_file"; then
                rm -f "$error_file"
                return 1
              fi
              sed -n '1,20p' "$error_file" >&2
              rm -f "$error_file"
              return 2
            }

            validate_child() {
              local target_arch="$1"
              local child_ref="$2"
              local expected_image_id="$3"
              local evidence_prefix="$4"
              local raw_file="$evidence_prefix-raw.json"
              local descriptor_file="$evidence_prefix-descriptor.json"
              local image_file
              image_file=$(mktemp)

              docker buildx imagetools inspect --raw "$child_ref" > "$raw_file"
              docker buildx imagetools inspect \
                --format '{{json .Manifest}}' "$child_ref" > "$descriptor_file"
              docker buildx imagetools inspect \
                --format '{{json .Image}}' "$child_ref" > "$image_file"

              jq -e --arg image_id "$expected_image_id" '
                (.mediaType == "application/vnd.oci.image.manifest.v1+json" or
                 .mediaType == "application/vnd.docker.distribution.manifest.v2+json") and
                .config.digest == $image_id and
                (has("manifests") | not)
              ' "$raw_file" > /dev/null
              jq -e --arg architecture "$target_arch" '
                .os == "linux" and .architecture == $architecture
              ' "$image_file" > /dev/null
              rm -f "$image_file"

              CHILD_DIGEST=$(jq -r '.digest' "$descriptor_file")
              [[ "$CHILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            }

            publish_child() {
              local target_arch="$1"
              local candidate_tag
              case "$target_arch" in
                amd64) candidate_tag="$CANDIDATE_AMD64_TAG" ;;
                arm64) candidate_tag="$CANDIDATE_ARM64_TAG" ;;
                *) echo "Unsupported candidate architecture: $target_arch" >&2; return 1 ;;
              esac
              [[ "$candidate_tag" == "$CANDIDATE_TAG-$target_arch" ]]
              [[ "$candidate_tag" =~ ^base-edge-candidate-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}-(amd64|arm64)$ ]]

              local archive_dir="/tmp/workspace/base-edge-validation/$target_arch/image"
              local archive_file="$archive_dir/image.tar.gz"
              local metadata_file="$archive_dir/metadata.txt"
              local local_image="broker-edge-validation-$target_arch:$CIRCLE_WORKFLOW_ID"
              local child_ref="$CANDIDATE_REPOSITORY:$candidate_tag"
              local expected_archive_sha256 expected_image_id expected_platform
              expected_archive_sha256=$(awk -F= '$1 == "archive_sha256" { print $2 }' "$metadata_file")
              expected_image_id=$(awk -F= '$1 == "image_id" { print $2 }' "$metadata_file")
              expected_platform=$(awk -F= '$1 == "image_platform" { print $2 }' "$metadata_file")
              [[ "$expected_archive_sha256" =~ ^[0-9a-f]{64}$ ]]
              [[ "$expected_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
              test "$expected_platform" = "linux/$target_arch"
              test "$(sha256sum "$archive_file" | awk '{print $1}')" = "$expected_archive_sha256"

              docker load < "$archive_file"
              test "$(docker image inspect --format '{{.Id}}' "$local_image")" = "$expected_image_id"
              test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$local_image")" = "$expected_platform"

              local descriptor_file="$EVIDENCE_DIR/$target_arch-preflight-descriptor.json"
              local inspect_error="$EVIDENCE_DIR/$target_arch-preflight-error.txt"
              local inspect_status=0
              inspect_reference "$child_ref" "$descriptor_file" "$inspect_error" || inspect_status=$?
              case "$inspect_status" in
                0)
                  echo "Candidate child already exists; validating without overwriting: $child_ref"
                  validate_child "$target_arch" "$child_ref" "$expected_image_id" \
                    "$EVIDENCE_DIR/$target_arch"
                  printf 'existing\n' > "$EVIDENCE_DIR/$target_arch-publication-status.txt"
                  ;;
                1)
                  echo "Publishing absent candidate child: $child_ref"
                  docker tag "$local_image" "$child_ref"
                  docker push "$child_ref" 2>&1 | tee "$EVIDENCE_DIR/$target_arch-push.log"
                  validate_child "$target_arch" "$child_ref" "$expected_image_id" \
                    "$EVIDENCE_DIR/$target_arch"
                  printf 'created\n' > "$EVIDENCE_DIR/$target_arch-publication-status.txt"
                  ;;
                *)
                  echo "Unable to determine whether candidate child exists: $child_ref" >&2
                  return 1
                  ;;
              esac

              printf '%s\n' "$CHILD_DIGEST" > "$OUTPUT_DIR/$target_arch-digest"
              printf '%s\n' "$expected_image_id" > "$EVIDENCE_DIR/$target_arch-image-id.txt"
              printf '%s\n' "$expected_archive_sha256" > "$EVIDENCE_DIR/$target_arch-archive-sha256.txt"
            }

            publish_child amd64
            publish_child arm64
            AMD64_DIGEST=$(< "$OUTPUT_DIR/amd64-digest")
            ARM64_DIGEST=$(< "$OUTPUT_DIR/arm64-digest")
            {
              printf 'commit_sha=%s\n' "$CIRCLE_SHA1"
              printf 'workflow_id=%s\n' "$CIRCLE_WORKFLOW_ID"
              printf 'candidate_tag=%s\n' "$CANDIDATE_TAG"
              printf 'amd64_tag=%s\n' "$CANDIDATE_AMD64_TAG"
              printf 'amd64_digest=%s\n' "$AMD64_DIGEST"
              printf 'arm64_tag=%s\n' "$CANDIDATE_ARM64_TAG"
              printf 'arm64_digest=%s\n' "$ARM64_DIGEST"
            } | tee "$OUTPUT_DIR/children.txt" > "$EVIDENCE_DIR/children.txt"
      - run:
          name: Log out from Docker Hub
          command: docker logout
          when: always
      - store_artifacts:
          path: /tmp/base-edge-candidate-evidence/children
          destination: base-edge-validation/candidate/children
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - base-edge-validation/candidate
  assemble-and-validate-base-edge-candidate-index:
    <<: *defaults
    steps:
      - prepare
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: false
      - configure-base-edge-candidate-identity
      - dockerhub-login
      - run:
          name: Assemble and validate base-edge candidate index
          command: |
            set -euo pipefail
            EVIDENCE_DIR="/tmp/base-edge-candidate-evidence/index"
            OUTPUT_DIR="/tmp/workspace/base-edge-validation/candidate"
            CHILDREN_FILE="$OUTPUT_DIR/children.txt"
            mkdir -p "$EVIDENCE_DIR"

            docker buildx version | tee "$EVIDENCE_DIR/docker-buildx-version.txt"
            IMAGETOOLS_INSPECT_HELP=$(docker buildx imagetools inspect --help)
            [[ "$IMAGETOOLS_INSPECT_HELP" == *--format* ]]
            [[ "$IMAGETOOLS_INSPECT_HELP" == *--raw* ]]

            recorded_value() {
              local key="$1"
              awk -F= -v key="$key" '$1 == key { print $2 }' "$CHILDREN_FILE"
            }
            test "$(recorded_value commit_sha)" = "$CIRCLE_SHA1"
            test "$(recorded_value workflow_id)" = "$CIRCLE_WORKFLOW_ID"
            test "$(recorded_value candidate_tag)" = "$CANDIDATE_TAG"
            test "$(recorded_value amd64_tag)" = "$CANDIDATE_AMD64_TAG"
            test "$(recorded_value arm64_tag)" = "$CANDIDATE_ARM64_TAG"
            AMD64_DIGEST=$(recorded_value amd64_digest)
            ARM64_DIGEST=$(recorded_value arm64_digest)
            [[ "$AMD64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$ARM64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            test "$AMD64_DIGEST" != "$ARM64_DIGEST"

            inspect_reference() {
              local reference="$1"
              local descriptor_file="$2"
              local error_file="$3"
              if docker buildx imagetools inspect \
                --format '{{json .Manifest}}' "$reference" > "$descriptor_file" 2> "$error_file"; then
                rm -f "$error_file"
                return 0
              fi
              if grep -Eqi 'manifest unknown|not found|no such manifest' "$error_file"; then
                rm -f "$error_file"
                return 1
              fi
              sed -n '1,20p' "$error_file" >&2
              rm -f "$error_file"
              return 2
            }

            for architecture in amd64 arm64; do
              if [ "$architecture" = amd64 ]; then
                child_tag="$CANDIDATE_AMD64_TAG"
                expected_digest="$AMD64_DIGEST"
              else
                child_tag="$CANDIDATE_ARM64_TAG"
                expected_digest="$ARM64_DIGEST"
              fi
              child_ref="$CANDIDATE_REPOSITORY:$child_tag"
              docker buildx imagetools inspect \
                --format '{{json .Manifest}}' "$child_ref" \
                > "$EVIDENCE_DIR/$architecture-child-descriptor.json"
              test "$(jq -r '.digest' "$EVIDENCE_DIR/$architecture-child-descriptor.json")" = "$expected_digest"
            done

            INDEX_REF="$CANDIDATE_REPOSITORY:$CANDIDATE_TAG"
            INDEX_DESCRIPTOR="$EVIDENCE_DIR/index-descriptor.json"
            INSPECT_ERROR="$EVIDENCE_DIR/index-preflight-error.txt"
            INSPECT_STATUS=0
            inspect_reference "$INDEX_REF" "$INDEX_DESCRIPTOR" "$INSPECT_ERROR" || INSPECT_STATUS=$?
            case "$INSPECT_STATUS" in
              0)
                echo "Candidate index already exists; validating without overwriting: $INDEX_REF"
                printf 'existing\n' > "$EVIDENCE_DIR/index-publication-status.txt"
                ;;
              1)
                echo "Creating absent candidate index: $INDEX_REF"
                docker buildx imagetools create \
                  --progress plain \
                  --tag "$INDEX_REF" \
                  "$CANDIDATE_REPOSITORY@$AMD64_DIGEST" \
                  "$CANDIDATE_REPOSITORY@$ARM64_DIGEST" \
                  2>&1 | tee "$EVIDENCE_DIR/index-create.log"
                docker buildx imagetools inspect \
                  --format '{{json .Manifest}}' "$INDEX_REF" > "$INDEX_DESCRIPTOR"
                printf 'created\n' > "$EVIDENCE_DIR/index-publication-status.txt"
                ;;
              *)
                echo "Unable to determine whether candidate index exists: $INDEX_REF" >&2
                exit 1
                ;;
            esac

            INDEX_DIGEST=$(jq -r '.digest' "$INDEX_DESCRIPTOR")
            [[ "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker buildx imagetools inspect --raw "$INDEX_REF" > "$EVIDENCE_DIR/index-raw.json"
            RAW_INDEX_SHA256=$(sha256sum "$EVIDENCE_DIR/index-raw.json" | awk '{print $1}')
            [[ "$RAW_INDEX_SHA256" =~ ^[0-9a-f]{64}$ ]]
            test "sha256:$RAW_INDEX_SHA256" = "$INDEX_DIGEST"
            printf '%s\n' "$RAW_INDEX_SHA256" > "$EVIDENCE_DIR/index-raw-sha256.txt"
            jq -e --arg amd64_digest "$AMD64_DIGEST" --arg arm64_digest "$ARM64_DIGEST" '
              def runnable:
                . == "application/vnd.oci.image.manifest.v1+json" or
                . == "application/vnd.docker.distribution.manifest.v2+json";
              def allowed_index:
                . == "application/vnd.oci.image.index.v1+json" or
                . == "application/vnd.docker.distribution.manifest.list.v2+json";
              .schemaVersion == 2 and
              (.mediaType | allowed_index) and
              (.manifests | length) == 2 and
              all(.manifests[]; (.mediaType | runnable)) and
              all(.manifests[];
                if .platform.os == "linux" and .platform.architecture == "amd64" then
                  .digest == $amd64_digest and
                  .platform == {"architecture":"amd64","os":"linux"}
                elif .platform.os == "linux" and .platform.architecture == "arm64" then
                  .digest == $arm64_digest and
                  ((.platform | keys) - ["architecture","os","variant"] | length) == 0 and
                  ((.platform | has("variant") | not) or .platform.variant == "v8")
                else
                  false
                end
              ) and
              ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length) == 1 and
              ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length) == 1
            ' "$EVIDENCE_DIR/index-raw.json" > /dev/null

            docker buildx imagetools inspect \
              --format '{{json .Manifest}}' "$CANDIDATE_REPOSITORY@$INDEX_DIGEST" \
              > "$EVIDENCE_DIR/index-immutable-descriptor.json"
            test "$(jq -r '.digest' "$EVIDENCE_DIR/index-immutable-descriptor.json")" = "$INDEX_DIGEST"
            {
              printf 'commit_sha=%s\n' "$CIRCLE_SHA1"
              printf 'workflow_id=%s\n' "$CIRCLE_WORKFLOW_ID"
              printf 'candidate_tag=%s\n' "$CANDIDATE_TAG"
              printf 'index_digest=%s\n' "$INDEX_DIGEST"
              printf 'amd64_digest=%s\n' "$AMD64_DIGEST"
              printf 'arm64_digest=%s\n' "$ARM64_DIGEST"
            } | tee "$OUTPUT_DIR/index.txt" > "$EVIDENCE_DIR/index.txt"
      - run:
          name: Log out from Docker Hub
          command: docker logout
          when: always
      - store_artifacts:
          path: /tmp/base-edge-candidate-evidence/index
          destination: base-edge-validation/candidate/index
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - base-edge-validation/candidate/index.txt
  sign-and-verify-base-edge-candidate-index:
    <<: *defaults
    steps:
      - prepare
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: false
      - configure-base-edge-candidate-identity
      - install-cosign
      - dockerhub-login
      - run:
          name: Sign and verify base-edge candidate index
          command: |
            set -euo pipefail
            EVIDENCE_DIR="/tmp/base-edge-candidate-evidence/signing"
            INDEX_FILE="/tmp/workspace/base-edge-validation/candidate/index.txt"
            mkdir -p "$EVIDENCE_DIR"

            recorded_value() {
              local key="$1"
              awk -F= -v key="$key" '$1 == key { print $2 }' "$INDEX_FILE"
            }
            test "$(recorded_value commit_sha)" = "$CIRCLE_SHA1"
            test "$(recorded_value workflow_id)" = "$CIRCLE_WORKFLOW_ID"
            test "$(recorded_value candidate_tag)" = "$CANDIDATE_TAG"
            INDEX_DIGEST=$(recorded_value index_digest)
            AMD64_DIGEST=$(recorded_value amd64_digest)
            ARM64_DIGEST=$(recorded_value arm64_digest)
            [[ "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$AMD64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$ARM64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

            INDEX_REF="$CANDIDATE_REPOSITORY:$CANDIDATE_TAG"
            INDEX_WITH_DIGEST="$CANDIDATE_REPOSITORY@$INDEX_DIGEST"
            docker buildx imagetools inspect \
              --format '{{json .Manifest}}' "$INDEX_REF" > "$EVIDENCE_DIR/index-tag-descriptor.json"
            test "$(jq -r '.digest' "$EVIDENCE_DIR/index-tag-descriptor.json")" = "$INDEX_DIGEST"
            docker buildx imagetools inspect --raw "$INDEX_WITH_DIGEST" > "$EVIDENCE_DIR/index-raw.json"

            VERIFICATION_KEY=/tmp/base-edge-candidate-cosign.pub
            DERIVED_KEY=/tmp/base-edge-candidate-derived-cosign.pub
            cleanup_key() {
              unset COSIGN_KEY
              rm -f "$VERIFICATION_KEY" "$DERIVED_KEY"
            }
            trap cleanup_key EXIT
            {
              printf '%s\n' '-----BEGIN PUBLIC KEY-----'
              printf '%s\n' 'MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEuY8yhCJLjedD84iS254YZKeR4VLQ'
              printf '%s\n' 'nMHOwUMRVWiVK9y06prT5FVs6bXE4i6rxI1wTfoRg3Zt80OTIVj2sggDVw=='
              printf '%s\n' '-----END PUBLIC KEY-----'
            } > "$VERIFICATION_KEY"

            export COSIGN_KEY
            COSIGN_KEY=$(printf '%s' "$COSIGN_ENCODED_KEY" | base64 --decode)
            cosign public-key --key env://COSIGN_KEY > "$DERIVED_KEY"
            unset COSIGN_KEY
            if ! cmp -s "$VERIFICATION_KEY" "$DERIVED_KEY"; then
              echo "CircleCI signing key does not match the authoritative organizational Broker public key" >&2
              exit 1
            fi
            PUBLIC_KEY_FINGERPRINT=$(sha256sum "$VERIFICATION_KEY" | awk '{print $1}')
            [[ "$PUBLIC_KEY_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
            test "$PUBLIC_KEY_FINGERPRINT" = "95adcbd7379697a184f86be6a9c7137f840211eaa6505b7f0aa626260e6c5bc6"
            {
              printf 'public_key_source=authoritative-organizational-1password-vault\n'
              printf 'public_key_sha256=%s\n' "$PUBLIC_KEY_FINGERPRINT"
              printf 'verification_scope=mechanical-corresponding-key-not-independent-consumer-trust-anchor-validation\n'
            } | tee "$EVIDENCE_DIR/public-key-evidence.txt"

            SIGNATURE_TAG="sha256-${INDEX_DIGEST#sha256:}.sig"
            [[ "$SIGNATURE_TAG" =~ ^sha256-[0-9a-f]{64}\.sig$ ]]
            SIGNATURE_REF="$CANDIDATE_REPOSITORY:$SIGNATURE_TAG"
            SIGNATURE_EXISTS=false
            if docker buildx imagetools inspect \
              --format '{{json .Manifest}}' "$SIGNATURE_REF" \
              > "$EVIDENCE_DIR/signature-preflight-descriptor.json" 2> "$EVIDENCE_DIR/signature-preflight-error.txt"; then
              SIGNATURE_EXISTS=true
              rm -f "$EVIDENCE_DIR/signature-preflight-error.txt"
            elif grep -Eqi 'manifest unknown|not found|no such manifest' \
              "$EVIDENCE_DIR/signature-preflight-error.txt"; then
              rm -f "$EVIDENCE_DIR/signature-preflight-error.txt"
            else
              sed -n '1,20p' "$EVIDENCE_DIR/signature-preflight-error.txt" >&2
              rm -f "$EVIDENCE_DIR/signature-preflight-error.txt"
              exit 1
            fi

            if [ "$SIGNATURE_EXISTS" = true ]; then
              echo "Candidate signature already exists; verifying without overwriting: $SIGNATURE_REF"
              cosign verify \
                --key "$VERIFICATION_KEY" \
                --annotations "tag=$CANDIDATE_TAG" \
                "$INDEX_WITH_DIGEST" > "$EVIDENCE_DIR/cosign-verification.json"
              printf 'existing\n' > "$EVIDENCE_DIR/signature-publication-status.txt"
            else
              echo "Signing immutable candidate index with existing Cosign/Rekor behavior: $INDEX_WITH_DIGEST"
              export COSIGN_KEY
              COSIGN_KEY=$(printf '%s' "$COSIGN_ENCODED_KEY" | base64 --decode)
              cosign sign \
                --yes \
                --key env://COSIGN_KEY \
                --annotations "tag=$CANDIDATE_TAG" \
                "$INDEX_WITH_DIGEST" 2>&1 | tee "$EVIDENCE_DIR/cosign-sign.log"
              unset COSIGN_KEY
              cosign verify \
                --key "$VERIFICATION_KEY" \
                --annotations "tag=$CANDIDATE_TAG" \
                "$INDEX_WITH_DIGEST" > "$EVIDENCE_DIR/cosign-verification.json"
              printf 'created\n' > "$EVIDENCE_DIR/signature-publication-status.txt"
            fi

            docker buildx imagetools inspect \
              --format '{{json .Manifest}}' "$INDEX_REF" \
              > "$EVIDENCE_DIR/index-tag-post-signing-descriptor.json"
            test "$(jq -r '.digest' "$EVIDENCE_DIR/index-tag-post-signing-descriptor.json")" = "$INDEX_DIGEST"

            docker buildx imagetools inspect \
              --format '{{json .Manifest}}' "$SIGNATURE_REF" \
              > "$EVIDENCE_DIR/signature-descriptor.json"
            {
              printf 'commit_sha=%s\n' "$CIRCLE_SHA1"
              printf 'workflow_id=%s\n' "$CIRCLE_WORKFLOW_ID"
              printf 'candidate_tag=%s\n' "$CANDIDATE_TAG"
              printf 'index_digest=%s\n' "$INDEX_DIGEST"
              printf 'signature_tag=%s\n' "$SIGNATURE_TAG"
              printf 'rekor_record=permanent-public-default-cosign-v2.2.0-behavior\n'
            } > "$EVIDENCE_DIR/signing-summary.txt"
            cleanup_key
            trap - EXIT
      - run:
          name: Log out from Docker Hub
          command: docker logout
          when: always
      - store_artifacts:
          path: /tmp/base-edge-candidate-evidence/signing
          destination: base-edge-validation/candidate/signing
  build-and-save-docker-image:
    <<: *defaults
    environment:
      BUILDKIT_PROGRESS: plain
      DOCKER_BUILDKIT: 1
    parameters:
      additional_arguments:
        type: string
        default: ""
      dockerfile:
        type: string
      nodejs_cycle:
        type: string
        default: "24"
      project_name:
        type: string
        default: "broker"
    steps:
      - prepare
      - setup_remote_docker:
          docker_layer_caching: true
      - get-and-set-tagged-broker-version
      - get-latest-nodejs-version:
          cycle: <<parameters.nodejs_cycle>>
      - build-and-save-docker-image:
          additional_arguments: <<parameters.additional_arguments>> --build-arg BROKER_VERSION=$BROKER_VERSION --build-arg NODE_VERSION=$NODE_LATEST_VERSION
          dockerfile: <<parameters.dockerfile>>
          project_name: <<parameters.project_name>>
  build-and-save-docker-ubi-image:
    <<: *defaults
    environment:
      BUILDKIT_PROGRESS: plain
      DOCKER_BUILDKIT: 1
    parameters:
      additional_arguments:
        type: string
        default: ""
      dockerfile:
        type: string
      project_name:
        type: string
        default: "broker"
    steps:
      - prepare
      - setup_remote_docker:
          docker_layer_caching: false
      - get-and-set-tagged-broker-version
      - get-latest-nodejs-version
      - build-and-save-docker-image:
          additional_arguments: <<parameters.additional_arguments>> --build-arg BROKER_VERSION=$BROKER_VERSION --build-arg NODE_VERSION=$NODE_LATEST_VERSION
          dockerfile: <<parameters.dockerfile>>
          project_name: <<parameters.project_name>>
  scan-docker-image:
    <<: *defaults
    parameters:
      mode:
        type: string
      dockerfile:
        type: string
      project:
        type: string
      project_name:
        type: string
        default: "broker"
    steps:
      - prepare
      - setup_remote_docker:
          docker_layer_caching: false
      - load-docker-image:
          project_name: <<parameters.project_name>>
      - prodsec/container_scan:
          mode: <<parameters.mode>>
          docker-image-name: <<parameters.project_name>>:${CIRCLE_WORKFLOW_ID}
          docker-file: <<parameters.dockerfile>>
          project-name: <<parameters.project>>
  tag-and-push-docker-image:
    <<: *defaults
    parameters:
      image_name:
        type: string
      image_tag:
        type: string
      project_name:
        type: string
        default: "broker"
    steps:
      - prepare
      - setup_remote_docker:
          docker_layer_caching: true
      - dockerhub-login
      - load-docker-image:
          project_name: <<parameters.project_name>>
      - install-cosign
      - tag-and-push-docker-image:
          image_name: <<parameters.image_name>>
          image_tag: <<parameters.image_tag>>
          project_name: <<parameters.project_name>>
      - dockerhub-logout
  build-and-push-dev-docker-image:
    <<: *defaults
    environment:
      BUILDKIT_PROGRESS: plain
      DOCKER_BUILDKIT: 1
    parameters:
      additional_arguments:
        type: string
        default: ""
      dockerfile:
        type: string
      image_name:
        type: string
      image_tag:
        type: string
      project_name:
        type: string
        default: "broker"
    steps:
      - prepare
      - setup_remote_docker:
          docker_layer_caching: false
      - dockerhub-login
      - prepare-dev-package-metadata
      - build-and-save-docker-image:
          additional_arguments: <<parameters.additional_arguments>>
          dockerfile: <<parameters.dockerfile>>
          project_name: <<parameters.project_name>>
      - load-docker-image:
          project_name: <<parameters.project_name>>
      - prodsec/container_scan:
          mode: gate
          docker-image-name: <<parameters.project_name>>:$CIRCLE_WORKFLOW_ID
          docker-file: <<parameters.dockerfile>>
          project-name: <<parameters.project_name>>
      - install-cosign
      - tag-and-push-docker-image:
          image_name: <<parameters.image_name>>
          image_tag: <<parameters.image_tag>>
          project_name: <<parameters.project_name>>
      - dockerhub-logout
  release:
    <<: *defaults
    steps:
      - prepare
      - attach_workspace:
          at: ~/broker
      - run:
          name: Release to GitHub
          no_output_timeout: 20m
          command: |
            npm install --save-exact --save-dev semantic-release@25.0.3 @semantic-release/exec@7.1.0 pkg@5.8.1
            npx semantic-release

workflows:
  CICD:
    jobs:
      - prodsec/secrets-scan:
          name: Scan repository for secrets
          context:
            - snyk-bot-slack
            - prodsec-orb-runtime
          channel: hybrid-cicd-alerts
          trusted-branch: main

      # Temporary ARM64 validation; remove before merging to main.
      - resolve-base-edge-validation-inputs:
          name: Resolve base-edge validation inputs
          requires:
            - Scan repository for secrets
          filters:
            branches:
              only: feat/arm64-base-edge
            tags:
              ignore: /.*/

      - build-base-edge-validation-image:
          name: Build base-edge validation image (AMD64)
          requires:
            - Resolve base-edge validation inputs
          architecture: amd64
          resource_class: medium
          filters:
            branches:
              only: feat/arm64-base-edge
            tags:
              ignore: /.*/

      - build-base-edge-validation-image:
          name: Build base-edge validation image (ARM64)
          requires:
            - Resolve base-edge validation inputs
          architecture: arm64
          resource_class: arm.medium
          filters:
            branches:
              only: feat/arm64-base-edge
            tags:
              ignore: /.*/

      - scan-base-edge-validation-image:
          name: Scan base-edge validation image (AMD64)
          context:
            - snyk-bot-slack
            - platformeng_access
            - prodsec-orb-runtime
          requires:
            - Build base-edge validation image (AMD64)
          architecture: amd64
          filters:
            branches:
              only: feat/arm64-base-edge
            tags:
              ignore: /.*/

      - scan-base-edge-validation-image:
          name: Scan base-edge validation image (ARM64)
          context:
            - snyk-bot-slack
            - platformeng_access
            - prodsec-orb-runtime
          requires:
            - Build base-edge validation image (ARM64)
          architecture: arm64
          filters:
            branches:
              only: feat/arm64-base-edge
            tags:
              ignore: /.*/

      # PUBLICATION SAFETY HOLD:
      # Publication requires written maintainer approval for the exact commit SHA,
      # public candidate/signature tags, permanent Rekor record, named cleanup owner,
      # and cleanup deadline. The CircleCI approver must verify the workflow commit SHA
      # before approval.
      - approve-base-edge-candidate-publication:
          name: Approve public base-edge candidate publication
          type: approval
          requires:
            - Scan base-edge validation image (AMD64)
            - Scan base-edge validation image (ARM64)
          filters:
            branches:
              only: feat/arm64-base-edge
            tags:
              ignore: /.*/

      - publish-base-edge-candidate-children:
          name: Publish base-edge candidate children
          context:
