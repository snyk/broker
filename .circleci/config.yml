version: 2.1

orbs:
  prodsec: snyk/prodsec-orb@1
  slack: circleci/slack@4.12.5

defaults: &defaults
  docker:
    - image: cimg/node:24.15
  working_directory: ~/broker
filter-tags-only: &filter-tags-only
  filters:
    tags:
      only: /^v.*/
    branches:
      ignore: /.*/
filter-dev-branch-only: &filter-dev-branch-only
  filters:
    branches:
      only: /dev\/.*/

parameters:
  fail_on_issues:
    type: boolean
    default: true

commands:
  dockerhub-login:
    steps:
      - run:
          name: Log in to a Docker registry
          command: echo $DOCKERHUB_PASSWORD | docker login -u $DOCKERHUB_USERNAME --password-stdin
  dockerhub-logout:
    steps:
      - run:
          name: Logout from a Docker registry
          command: docker logout
  get-and-set-tagged-broker-version:
    description: "Get and set version of Broker NPM package"
    steps:
      - run:
          name: Get tagged version of Broker NPM package
          command: |
            echo "Getting tagged version of Broker NPM package..."
            BROKER_VERSION=${CIRCLE_TAG/v/''}
            echo $BROKER_VERSION
            echo "export BROKER_VERSION=$BROKER_VERSION" >> "$BASH_ENV"
      - run:
          name: Set Broker version in package.json
          command: |
            npm version --commit-hooks false --git-tag-version false ${BROKER_VERSION}
  get-latest-nodejs-version:
    description: "Get latest version of specific Node.js cycle"
    parameters:
      cycle:
        type: string
        default: "20"
    steps:
      - run:
          name: Get latest Node.js <<parameters.cycle>> version
          command: |
            echo "Getting latest Node.js <<parameters.cycle>> version..."
            NODE_LATEST_VERSION=$(curl --silent https://endoflife.date/api/nodejs.json | jq -r '.[] | select (.cycle == "<<parameters.cycle>>")' | jq -r .latest)
            echo $NODE_LATEST_VERSION
            echo "export NODE_LATEST_VERSION=$NODE_LATEST_VERSION" >> "$BASH_ENV"
  install-cosign:
    parameters:
      version:
        type: string
        default: "v2.2.0"
    steps:
      - run:
          name: Install cosign
          command: |
            curl -L https://github.com/sigstore/cosign/releases/download/<<parameters.version>>/cosign-linux-amd64 -o cosign
            chmod +x cosign && sudo mv cosign /usr/local/bin/cosign
      - run:
          name: Verify cosign
          command: cosign version
  build-and-save-docker-image:
    description: "Build Docker image and save it to workspace"
    parameters:
      additional_arguments:
        type: string
        default: ""
      dockerfile:
        type: string
        default: ""
      project_name:
        type: string
        default: "broker"
    steps:
      - run:
          name: Build Docker image (<<parameters.project_name>> - <<parameters.dockerfile>>)
          command: |
            echo "Building Broker image $CIRCLE_PROJECT_REPONAME:$CIRCLE_WORKFLOW_ID..."
            docker build \
              <<#parameters.additional_arguments>><<parameters.additional_arguments>><</parameters.additional_arguments>> \
              --no-cache \
              --tag <<parameters.project_name>>:$CIRCLE_WORKFLOW_ID \
              --file <<parameters.dockerfile>> .
      - run:
          name: Archive Docker image
          command: |
            mkdir -p /tmp/workspace/images
            docker save <<parameters.project_name>>:$CIRCLE_WORKFLOW_ID \
              | gzip > "/tmp/workspace/images/<<parameters.project_name>>:$CIRCLE_WORKFLOW_ID.tar.gz"
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - images
  load-docker-image:
    description: "Load a saved Docker image"
    parameters:
      project_name:
        type: string
        default: "broker"
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Load archived Docker image
          command: |
            docker load < "/tmp/workspace/images/<<parameters.project_name>>:$CIRCLE_WORKFLOW_ID.tar.gz"
  load-slack-templates:
    steps:
      - run:
          name: Load Slack message templates
          command: |
            echo 'export SLACK_FAIL_MESSAGE_TEMPLATE=$(cat .circleci/templates/slack_fail_message.json)' >> $BASH_ENV
  notify-slack-on-failure:
    parameters:
      channel:
        type: string
        default: hybrid-cicd-alerts
    steps:
      - slack/notify:
          channel: <<parameters.channel>>
          event: fail
          template: SLACK_FAIL_MESSAGE_TEMPLATE
  tag-and-push-docker-image:
    description: "Tag and push Docker image to registry"
    parameters:
      image_name:
        type: string
      image_tag:
        type: string
      project_name:
        type: string
        default: "broker"
    steps:
      - run:
          name: Tag Docker image
          command: |
            export IMAGE_NAME=<<parameters.image_name>>
            export IMAGE_TAG=${CIRCLE_TAG/v/''}-<<parameters.image_tag>>
            export IMAGE_TAG_LATEST=<<parameters.image_tag>>
            [[ "$IMAGE_TAG" =~ .*dev$ ]] && export IMAGE_TAG=<<parameters.image_tag>>
            [[ "$IMAGE_TAG" =~ .*dev$ ]] && export IMAGE_TAG_LATEST=<<parameters.image_tag>>

            echo "Configured Broker image tags:"
            echo "  - IMAGE_TAG:        $IMAGE_TAG"
            echo "  - IMAGE_TAG_LATEST: $IMAGE_TAG_LATEST"

            echo "Tagging Broker image $IMAGE_NAME:$IMAGE_TAG..."
            docker tag <<parameters.project_name>>:$CIRCLE_WORKFLOW_ID $IMAGE_NAME:$IMAGE_TAG
            echo "Tagging Broker image $IMAGE_NAME:$IMAGE_TAG_LATEST..."
            docker tag <<parameters.project_name>>:$CIRCLE_WORKFLOW_ID $IMAGE_NAME:$IMAGE_TAG_LATEST

            echo "export IMAGE_NAME=$IMAGE_NAME" >> "$BASH_ENV"
            echo "export IMAGE_TAG=$IMAGE_TAG" >> "$BASH_ENV"
            echo "export IMAGE_TAG_LATEST=$IMAGE_TAG_LATEST" >> "$BASH_ENV"
      - run:
          name: Push Docker image
          command: |
            echo "Pushing Broker image $IMAGE_NAME:$IMAGE_TAG..."
            docker push $IMAGE_NAME:$IMAGE_TAG
            echo "Pushing Broker image $IMAGE_NAME:$IMAGE_TAG_LATEST..."
            docker push $IMAGE_NAME:$IMAGE_TAG_LATEST
      - run:
          name: Sign Docker image with Cosign
          command: |
            export IMAGE_WITH_DIGEST=$(docker image inspect --format='{{index .RepoDigests 0}}' $IMAGE_NAME:$IMAGE_TAG)
            echo "Using digest $IMAGE_WITH_DIGEST to sign the image..."
            export COSIGN_KEY=$(echo $COSIGN_ENCODED_KEY | base64 -d)
            cosign sign --yes --key env://COSIGN_KEY --annotations tag=$IMAGE_TAG $IMAGE_WITH_DIGEST
            unset COSIGN_KEY
  prepare:
    description: "Checkout repository source code and load all Slack templates"
    steps:
      - checkout
      - load-slack-templates
  prepare-dev-package-metadata:
    steps:
      - run:
          name: Prepare package.json and metadata.json for dev images
          command: |
            cd dockerfiles/.scripts && source prepare.sh

jobs:
  install-npm-packages:
    <<: *defaults
    environment:
      NODE_ENV: development
    steps:
      - prepare
      - run:
          name: Install NPM packages
          command: npm clean-install
      - persist_to_workspace:
          root: .
          paths:
            - node_modules/
  lint:
    <<: *defaults
    steps:
      - prepare
      - attach_workspace:
          at: ~/broker
      - run:
          name: Lint
          command: npm run lint
  lint-json-samples:
    <<: *defaults
    steps:
      - prepare
      - run:
          name: Lint JSON templates
          command: ./lintVerifier.sh
  test:
    <<: *defaults
    steps:
      - prepare
      - attach_workspace:
          at: ~/broker
      - run:
          name: Run tests
          command: npm test && npm run test:bin
      - store_test_results:
          path: reports
  security-scans:
    <<: *defaults
    steps:
      - prepare
      - attach_workspace:
          at: ~/broker
      - prodsec/security_scans:
          mode: auto
          open-source-additional-arguments: --exclude=test
          release-branch: main
  resolve-base-edge-validation-inputs:
    <<: *defaults
    steps:
      - prepare
      - get-latest-nodejs-version:
          cycle: "26"
      - run:
          name: Persist base-edge validation inputs
          command: |
            set -euo pipefail
            if [[ ! "$NODE_LATEST_VERSION" =~ ^26\.[0-9]+\.[0-9]+$ ]]; then
              echo "Unexpected Node.js 26 version: $NODE_LATEST_VERSION" >&2
              exit 1
            fi
            mkdir -p /tmp/workspace/base-edge-validation
            printf '%s\n' "$NODE_LATEST_VERSION" > /tmp/workspace/base-edge-validation/node-version
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - base-edge-validation/node-version
  build-base-edge-validation-image:
    <<: *defaults
    environment:
      BUILDKIT_PROGRESS: plain
      DOCKER_BUILDKIT: 1
    parameters:
      architecture:
        type: enum
        enum: ["amd64", "arm64"]
      resource_class:
        type: string
    resource_class: << parameters.resource_class >>
    steps:
      - prepare
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: false
      - run:
          name: Verify native << parameters.architecture >> execution
          command: |
            set -euo pipefail
            TARGET_ARCH="<< parameters.architecture >>"
            case "$TARGET_ARCH" in
              amd64) EXPECTED_UNAME="x86_64" ;;
              arm64) EXPECTED_UNAME="aarch64" ;;
              *) echo "Unsupported architecture: $TARGET_ARCH" >&2; exit 1 ;;
            esac

            PRIMARY_ARCH=$(uname -m)
            DOCKER_SERVER_ARCH=$(docker version --format '{{.Server.Arch}}')
            echo "Primary executor architecture: $PRIMARY_ARCH"
            echo "Remote Docker server architecture: $DOCKER_SERVER_ARCH"

            test "$PRIMARY_ARCH" = "$EXPECTED_UNAME"
            test "$DOCKER_SERVER_ARCH" = "$TARGET_ARCH"
      - run:
          name: Build base-edge validation image (<< parameters.architecture >>)
          command: |
            set -euo pipefail
            TARGET_ARCH="<< parameters.architecture >>"
            case "$TARGET_ARCH" in
              amd64)
                EXPECTED_UNAME="x86_64"
                EXPECTED_NODE_ARCH="x64"
                ;;
              arm64)
                EXPECTED_UNAME="aarch64"
                EXPECTED_NODE_ARCH="arm64"
                ;;
              *) echo "Unsupported architecture: $TARGET_ARCH" >&2; exit 1 ;;
            esac
            IMAGE_NAME="broker-edge-validation-$TARGET_ARCH:$CIRCLE_WORKFLOW_ID"
            NODE_BASE_IMAGE_NAME="broker-edge-validation-node-base-$TARGET_ARCH:$CIRCLE_WORKFLOW_ID"
            NODE_VERSION=$(< /tmp/workspace/base-edge-validation/node-version)
            EVIDENCE_DIR="/tmp/workspace/base-edge-validation/$TARGET_ARCH/evidence"
            mkdir -p "$EVIDENCE_DIR"

            docker build \
              --build-arg BASE_IMAGE=ubuntu:26.04 \
              --build-arg BROKER_VERSION="$CIRCLE_SHA1" \
              --build-arg NODE_VERSION="$NODE_VERSION" \
              --no-cache \
              --platform="linux/$TARGET_ARCH" \
              --tag "$IMAGE_NAME" \
              --file dockerfiles/base/Dockerfile . \
              2>&1 | tee "$EVIDENCE_DIR/docker-build.log"

            IMAGE_PLATFORM=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE_NAME")
            test "$IMAGE_PLATFORM" = "linux/$TARGET_ARCH"

            docker build \
              --build-arg BASE_IMAGE=ubuntu:26.04 \
              --build-arg NODE_VERSION="$NODE_VERSION" \
              --platform="linux/$TARGET_ARCH" \
              --target node-base \
              --tag "$NODE_BASE_IMAGE_NAME" \
              --file dockerfiles/base/Dockerfile . \
              2>&1 | tee "$EVIDENCE_DIR/node-base-build.log"

            NODE_BASE_NODE_VERSION=$(docker run --rm "$NODE_BASE_IMAGE_NAME" node --version)
            NODE_BASE_NPM_VERSION=$(docker run --rm "$NODE_BASE_IMAGE_NAME" npm --version)
            test "$NODE_BASE_NODE_VERSION" = "v$NODE_VERSION"

            RUNTIME_UNAME=$(docker run --rm "$IMAGE_NAME" uname -m)
            RUNTIME_NODE_VERSION=$(docker run --rm "$IMAGE_NAME" node --version)
            RUNTIME_NODE_ARCH=$(docker run --rm "$IMAGE_NAME" node -p process.arch)
            test "$RUNTIME_UNAME" = "$EXPECTED_UNAME"
            test "$RUNTIME_NODE_VERSION" = "v$NODE_VERSION"
            test "$RUNTIME_NODE_ARCH" = "$EXPECTED_NODE_ARCH"
            {
              echo "requested_platform=linux/$TARGET_ARCH"
              echo "image_platform=$IMAGE_PLATFORM"
              echo "resolved_node_version=$NODE_VERSION"
              echo "node_base_node_version=$NODE_BASE_NODE_VERSION"
              echo "node_base_npm_version=$NODE_BASE_NPM_VERSION"
              echo "runtime_uname=$RUNTIME_UNAME"
              echo "runtime_node_version=$RUNTIME_NODE_VERSION"
              echo "runtime_node_arch=$RUNTIME_NODE_ARCH"
              echo "image_id=$(docker image inspect --format '{{.Id}}' "$IMAGE_NAME")"
            } | tee "$EVIDENCE_DIR/build-evidence.txt"
      - run:
          name: Smoke test base-edge validation image (<< parameters.architecture >>)
          command: |
            set -euo pipefail
            TARGET_ARCH="<< parameters.architecture >>"
            IMAGE_NAME="broker-edge-validation-$TARGET_ARCH:$CIRCLE_WORKFLOW_ID"
            CONTAINER_NAME="broker-edge-smoke-$TARGET_ARCH-$CIRCLE_WORKFLOW_ID"
            EVIDENCE_DIR="/tmp/workspace/base-edge-validation/$TARGET_ARCH/evidence"

            cleanup() {
              status=$?
              trap - EXIT
              if [ "$status" -ne 0 ]; then
                docker logs "$CONTAINER_NAME" 2>&1 | tee "$EVIDENCE_DIR/smoke-container.log" || true
              fi
              docker rm --force "$CONTAINER_NAME" >/dev/null 2>&1 || true
              exit "$status"
            }
            trap cleanup EXIT
            trap 'exit 130' INT
            trap 'exit 143' TERM

            docker run \
              --detach \
              --name "$CONTAINER_NAME" \
              --env ACCEPT=/home/node/defaultFilters/github.json \
              "$IMAGE_NAME" \
              broker server --port 7341
            docker exec "$CONTAINER_NAME" broker --help > "$EVIDENCE_DIR/broker-help.txt"

            healthy=false
            for attempt in $(seq 1 30); do
              if [ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")" != "true" ]; then
                echo "Broker container exited before becoming healthy" >&2
                exit 1
              fi
              if docker exec "$CONTAINER_NAME" node -e \
                "fetch('http://127.0.0.1:7341/healthcheck').then(async response => { const body = await response.json(); if (!response.ok || body.ok !== true) throw new Error(JSON.stringify(body)); console.log(JSON.stringify(body)); }).catch(error => { console.error(error); process.exit(1); })" \
                | tee "$EVIDENCE_DIR/healthcheck.json"; then
                healthy=true
                break
              fi
              echo "Healthcheck attempt $attempt failed"
              sleep 1
            done
            test "$healthy" = true
      - run:
          name: Archive base-edge validation image (<< parameters.architecture >>)
          command: |
            set -euo pipefail
            TARGET_ARCH="<< parameters.architecture >>"
            IMAGE_NAME="broker-edge-validation-$TARGET_ARCH:$CIRCLE_WORKFLOW_ID"
            ARCHIVE_DIR="/tmp/workspace/base-edge-validation/$TARGET_ARCH/image"
            mkdir -p "$ARCHIVE_DIR"
            docker save "$IMAGE_NAME" | gzip > "$ARCHIVE_DIR/image.tar.gz"
      - store_artifacts:
          path: /tmp/workspace/base-edge-validation/<< parameters.architecture >>/evidence
          destination: base-edge-validation/<< parameters.architecture >>/build
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - base-edge-validation/<< parameters.architecture >>
  scan-base-edge-validation-image:
    <<: *defaults
    resource_class: medium
    parameters:
      architecture:
        type: enum
        enum: ["amd64", "arm64"]
    steps:
      - prepare
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: false
      - run:
          name: Load base-edge validation image (<< parameters.architecture >>)
          command: |
            set -euo pipefail
            TARGET_ARCH="<< parameters.architecture >>"
            IMAGE_NAME="broker-edge-validation-$TARGET_ARCH:$CIRCLE_WORKFLOW_ID"
            docker load < "/tmp/workspace/base-edge-validation/$TARGET_ARCH/image/image.tar.gz"
            IMAGE_PLATFORM=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE_NAME")
            echo "Scanning image platform: $IMAGE_PLATFORM"
            test "$IMAGE_PLATFORM" = "linux/$TARGET_ARCH"
      - prodsec/container_scan:
          mode: gate
          docker-image-name: broker-edge-validation-<< parameters.architecture >>:${CIRCLE_WORKFLOW_ID}
          docker-file: dockerfiles/base/Dockerfile
          platform: linux/<< parameters.architecture >>
          log-file: /tmp/base-edge-validation-snyk-<< parameters.architecture >>.log
      - run:
          name: Collect Snyk evidence (<< parameters.architecture >>)
          when: always
          command: |
            TARGET_ARCH="<< parameters.architecture >>"
            EVIDENCE_DIR="/tmp/snyk-evidence/$TARGET_ARCH"
            mkdir -p "$EVIDENCE_DIR"
            if [ -f /tmp/container-scan.json ]; then
              cp /tmp/container-scan.json "$EVIDENCE_DIR/container-scan.json"
            fi
            if [ -f "/tmp/base-edge-validation-snyk-$TARGET_ARCH.log" ]; then
              cp "/tmp/base-edge-validation-snyk-$TARGET_ARCH.log" "$EVIDENCE_DIR/command.log"
            fi
      - store_artifacts:
          path: /tmp/snyk-evidence/<< parameters.architecture >>
          destination: base-edge-validation/<< parameters.architecture >>/snyk
  build-and-save-docker-image:
    <<: *defaults
    environment:
      BUILDKIT_PROGRESS: plain
      DOCKER_BUILDKIT: 1
    parameters:
      additional_arguments:
        type: string
        default: ""
      dockerfile:
        type: string
      nodejs_cycle:
        type: string
        default: "24"
      project_name:
        type: string
        default: "broker"
    steps:
      - prepare
      - setup_remote_docker:
          docker_layer_caching: true
      - get-and-set-tagged-broker-version
      - get-latest-nodejs-version:
          cycle: <<parameters.nodejs_cycle>>
      - build-and-save-docker-image:
          additional_arguments: <<parameters.additional_arguments>> --build-arg BROKER_VERSION=$BROKER_VERSION --build-arg NODE_VERSION=$NODE_LATEST_VERSION
          dockerfile: <<parameters.dockerfile>>
          project_name: <<parameters.project_name>>
  build-and-save-docker-ubi-image:
    <<: *defaults
    environment:
      BUILDKIT_PROGRESS: plain
      DOCKER_BUILDKIT: 1
    parameters:
      additional_arguments:
        type: string
        default: ""
      dockerfile:
        type: string
      project_name:
        type: string
        default: "broker"
    steps:
      - prepare
      - setup_remote_docker:
          docker_layer_caching: false
      - get-and-set-tagged-broker-version
      - get-latest-nodejs-version
      - build-and-save-docker-image:
          additional_arguments: <<parameters.additional_arguments>> --build-arg BROKER_VERSION=$BROKER_VERSION --build-arg NODE_VERSION=$NODE_LATEST_VERSION
          dockerfile: <<parameters.dockerfile>>
          project_name: <<parameters.project_name>>
  scan-docker-image:
    <<: *defaults
    parameters:
      mode:
        type: string
      dockerfile:
        type: string
      project:
        type: string
      project_name:
        type: string
        default: "broker"
    steps:
      - prepare
      - setup_remote_docker:
          docker_layer_caching: false
      - load-docker-image:
          project_name: <<parameters.project_name>>
      - prodsec/container_scan:
          mode: <<parameters.mode>>
          docker-image-name: <<parameters.project_name>>:${CIRCLE_WORKFLOW_ID}
          docker-file: <<parameters.dockerfile>>
          project-name: <<parameters.project>>
  tag-and-push-docker-image:
    <<: *defaults
    parameters:
      image_name:
        type: string
      image_tag:
        type: string
      project_name:
        type: string
        default: "broker"
    steps:
      - prepare
      - setup_remote_docker:
          docker_layer_caching: true
      - dockerhub-login
      - load-docker-image:
          project_name: <<parameters.project_name>>
      - install-cosign
      - tag-and-push-docker-image:
          image_name: <<parameters.image_name>>
          image_tag: <<parameters.image_tag>>
          project_name: <<parameters.project_name>>
      - dockerhub-logout
  build-and-push-dev-docker-image:
    <<: *defaults
    environment:
      BUILDKIT_PROGRESS: plain
      DOCKER_BUILDKIT: 1
    parameters:
      additional_arguments:
        type: string
        default: ""
      dockerfile:
        type: string
      image_name:
        type: string
      image_tag:
        type: string
      project_name:
        type: string
        default: "broker"
    steps:
      - prepare
      - setup_remote_docker:
          docker_layer_caching: false
      - dockerhub-login
      - prepare-dev-package-metadata
      - build-and-save-docker-image:
          additional_arguments: <<parameters.additional_arguments>>
          dockerfile: <<parameters.dockerfile>>
          project_name: <<parameters.project_name>>
      - load-docker-image:
          project_name: <<parameters.project_name>>
      - prodsec/container_scan:
          mode: gate
          docker-image-name: <<parameters.project_name>>:$CIRCLE_WORKFLOW_ID
          docker-file: <<parameters.dockerfile>>
          project-name: <<parameters.project_name>>
      - install-cosign
      - tag-and-push-docker-image:
          image_name: <<parameters.image_name>>
          image_tag: <<parameters.image_tag>>
          project_name: <<parameters.project_name>>
      - dockerhub-logout
  release:
    <<: *defaults
    steps:
      - prepare
      - attach_workspace:
          at: ~/broker
      - run:
          name: Release to GitHub
          no_output_timeout: 20m
          command: |
            npm install --save-exact --save-dev semantic-release@25.0.3 @semantic-release/exec@7.1.0 pkg@5.8.1
            npx semantic-release

workflows:
  CICD:
    jobs:
      - prodsec/secrets-scan:
          name: Scan repository for secrets
          context:
            - snyk-bot-slack
            - prodsec-orb-runtime
          channel: hybrid-cicd-alerts
          trusted-branch: main

      # Temporary ARM64 validation; remove before merging to main.
      - resolve-base-edge-validation-inputs:
          name: Resolve base-edge validation inputs
          requires:
            - Scan repository for secrets
          filters:
            branches:
              only: feat/arm64-base-edge
            tags:
              ignore: /.*/

      - build-base-edge-validation-image:
          name: Build base-edge validation image (AMD64)
          requires:
            - Resolve base-edge validation inputs
          architecture: amd64
          resource_class: medium
          filters:
            branches:
              only: feat/arm64-base-edge
            tags:
              ignore: /.*/

      - build-base-edge-validation-image:
          name: Build base-edge validation image (ARM64)
          requires:
            - Resolve base-edge validation inputs
          architecture: arm64
          resource_class: arm.medium
          filters:
            branches:
              only: feat/arm64-base-edge
            tags:
              ignore: /.*/

      - scan-base-edge-validation-image:
          name: Scan base-edge validation image (AMD64)
          context:
            - snyk-bot-slack
            - platformeng_access
            - prodsec-orb-runtime
          requires:
            - Build base-edge validation image (AMD64)
          architecture: amd64
          filters:
            branches:
              only: feat/arm64-base-edge
            tags:
              ignore: /.*/

      - scan-base-edge-validation-image:
          name: Scan base-edge validation image (ARM64)
          context:
            - snyk-bot-slack
            - platformeng_access
            - prodsec-orb-runtime
          requires:
            - Build base-edge validation image (ARM64)
          architecture: arm64
          filters:
            branches:
              only: feat/arm64-base-edge
            tags:
              ignore: /.*/

      - install-npm-packages:
          name: Install NPM packages
          requires:
            - Scan repository for secrets

      - lint-json-samples:
          name: Lint JSON samples
          requires:
            - Install NPM packages

      - lint:
          name: Lint
          requires:
            - Install NPM packages

      - test:
          name: Test
          requires:
            - Install NPM packages

      - security-scans:
          name: Snyk Security Scans
          context:
            - snyk-bot-slack
            - platformeng_access
            - prodsec-orb-runtime
          requires:
            - Install NPM packages

      - build-and-save-docker-image:
          name: Build base image (Ubuntu)
          requires:
            - Install NPM packages
          dockerfile: dockerfiles/base/Dockerfile
          nodejs_cycle: "24"
          project_name: broker

      - scan-docker-image:
          name: Scan base image (Ubuntu)
          context:
            - snyk-bot-slack
